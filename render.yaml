# Render Blueprint: one web service, Docker runtime (deterministic build —
# the Dockerfile builds the SPA with Node and serves everything from FastAPI).
# Deploy: push this repo to GitHub, then Render Dashboard → New → Blueprint.
# Full click-path and env-var explanations in DEPLOY.md.
services:
  - type: web
    name: fayda-wallet-registry
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/me
    envVars:
      # Production posture: dev surface absent, secrets required, cookie Secure.
      - key: APP_ENV
        value: production
      # Demo posture: mounts ONLY the mock Fayda IdP (personas), never /api/dev/*.
      - key: DEMO_MODE
        value: "1"
      # 256-bit values minted by Render at first deploy. Rotating SESSION_SECRET
      # logs everyone out; rotating FIN_PEPPER orphans every identity row —
      # treat the pepper as permanent for the life of the database (CLAUDE.md).
      - key: SESSION_SECRET
        generateValue: true
      - key: FIN_PEPPER
        generateValue: true
      # Wallet connector (public identifier, not a secret). Set it in the
      # dashboard after creating a Privy app; the SPA reads it at runtime via
      # /config.js, so changing it needs no rebuild. Leave unset to run the
      # demo with the designed "connector not configured" state.
      - key: PRIVY_APP_ID
        sync: false
      # Supabase Postgres connection string (R1). A live credential — set it
      # in the dashboard, never commit it. Without it the app refuses to
      # start: there is no SQLite fallback, and silently losing persistence
      # would be worse than failing loudly.
      - key: SUPABASE_DB_URL
        sync: false
      # R4 on-chain history. Optional: unset means the compliance panel says
      # "no explorer configured" rather than showing an empty history, which
      # would read as "this wallet never transacted" — a different claim.
      - key: CHAIN_EXPLORER_URL
        sync: false
      - key: CHAIN_EXPLORER_KEY
        sync: false
      # The public origin (PUBLIC_URL) is NOT set here on purpose: app.py
      # derives it from RENDER_EXTERNAL_URL, which Render injects
      # automatically. Set PUBLIC_URL only for a custom domain.

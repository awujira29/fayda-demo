<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fayda wallet registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700&family=Source+Serif+4:opsz,wght@8..60,300;8..60,700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Resolve theme before first paint: stored choice wins, else system.
    (function () {
      var t = localStorage.getItem('theme')
      if (t !== 'dark' && t !== 'light')
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = t
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- Runtime config from the backend (Privy app id); loads before the app
       module so the wallet seam sees it at import time. -->
  <script src="/config.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
